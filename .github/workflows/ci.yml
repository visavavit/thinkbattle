name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bunfig.toml sets minimumReleaseAge, which only applies when resolving.
      # --frozen-lockfile installs exactly what bun.lock pins, so CI can never
      # quietly drift onto a version a developer has not seen.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format
        run: bun run format:check

      - name: Build
        run: bun run build
        env:
          # The build inlines the VITE_* values, so it needs them present.
          # These are publishable keys, not secrets; set them as repository
          # variables so a fork's PR build still works.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
